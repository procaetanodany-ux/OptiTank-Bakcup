<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>OptiTank — Splash Screen</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100%;
  background:#111118;
  display:flex;align-items:center;justify-content:center;
  font-family:'Inter',sans-serif;
  overflow:hidden;
}

/* ── Phone shell ── */
.phone {
  width:390px;
  height:844px;
  background:#0C0B1E;
  border-radius:54px;
  overflow:hidden;
  position:relative;
  box-shadow:
    0 0 0 1px rgba(255,255,255,.14),
    0 0 0 10px #18171F,
    0 0 0 11px rgba(255,255,255,.07),
    0 48px 120px rgba(0,0,0,.9),
    0 0 80px rgba(108,99,255,.12);
  display:flex;
  align-items:center;
  justify-content:center;
}

/* Dynamic Island */
.island {
  position:absolute;
  top:14px; left:50%;
  transform:translateX(-50%);
  width:126px; height:36px;
  background:#000;
  border-radius:20px;
  z-index:10;
}

/* ── Splash content ── */
.splash {
  width:100%;height:100%;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:0;
  position:relative;
}

/* Background pulse ring */
.bg-ring {
  position:absolute;
  width:320px;height:320px;
  border-radius:50%;
  border:1px solid rgba(108,99,255,.15);
  animation: ringPulse 2.4s ease-out 1.8s both;
}
.bg-ring-2 {
  position:absolute;
  width:480px;height:480px;
  border-radius:50%;
  border:1px solid rgba(108,99,255,.07);
  animation: ringPulse 2.4s ease-out 2.1s both;
}
@keyframes ringPulse {
  from { opacity:0; transform:scale(.7); }
  20%  { opacity:1; }
  to   { opacity:0; transform:scale(1); }
}

/* ── Logo SVG ── */
.logo-wrap {
  position:relative;
  animation: logoFloat 3s ease-in-out 2.2s infinite alternate;
}
@keyframes logoFloat {
  from { transform: translateY(0px); }
  to   { transform: translateY(-8px); }
}

/* O ring — draw */
.o-ring {
  stroke-dasharray: 1319.5;
  stroke-dashoffset: 1319.5;
  animation: drawO 0.9s cubic-bezier(.4,0,.2,1) 0.35s forwards;
  stroke-linecap: round;
}
@keyframes drawO {
  to { stroke-dashoffset: 0; }
}

/* Teal dot — pop */
.teal-dot {
  transform-origin: 512px 586px;
  transform: scale(0);
  animation: popDot 0.4s cubic-bezier(.34,1.56,.64,1) 1.15s forwards;
}
@keyframes popDot {
  to { transform: scale(1); }
}

/* T bar — slide up */
.t-bar {
  transform-origin: 512px 709px;
  opacity:0;
  animation: slideT 0.5s cubic-bezier(.16,1,.3,1) 1.3s forwards;
}
.t-stem {
  transform-origin: 512px 804px;
  opacity:0;
  animation: slideT 0.5s cubic-bezier(.16,1,.3,1) 1.4s forwards;
}
@keyframes slideT {
  from { opacity:0; transform: translateY(40px); }
  to   { opacity:1; transform: translateY(0); }
}

/* ── Wordmark ── */
.wordmark {
  margin-top:32px;
  opacity:0;
  transform:translateY(12px);
  animation: fadeUp .55s ease 1.9s forwards;
  text-align:center;
}
.wordmark-name {
  font-size:32px;
  font-weight:900;
  color:#fff;
  letter-spacing:-1.2px;
  line-height:1;
}
.wordmark-name span { color:#00D4AA; }
.wordmark-tag {
  margin-top:7px;
  font-size:13px;
  font-weight:500;
  color:rgba(255,255,255,.28);
  letter-spacing:.04em;
}
@keyframes fadeUp {
  to { opacity:1; transform:translateY(0); }
}

/* ── Loader bar ── */
.loader-wrap {
  position:absolute;
  bottom:72px;
  left:50%;transform:translateX(-50%);
  width:120px;
  opacity:0;
  animation: fadeUp .4s ease 2.3s forwards;
}
.loader-track {
  height:3px;
  background:rgba(255,255,255,.08);
  border-radius:99px;
  overflow:hidden;
}
.loader-fill {
  height:100%;
  width:0%;
  background:#00D4AA;
  border-radius:99px;
  animation: fillBar 1.4s cubic-bezier(.4,0,.2,1) 2.5s forwards;
}
@keyframes fillBar {
  to { width:100%; }
}

/* Replay button */
.replay {
  position:absolute;
  bottom:18px;left:50%;
  transform:translateX(-50%);
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  border-radius:999px;
  padding:8px 20px;
  color:rgba(255,255,255,.35);
  font-size:12px;font-weight:600;
  cursor:pointer;
  font-family:'Inter',sans-serif;
  opacity:0;
  animation: fadeUp .3s ease 4.2s forwards;
  transition:all .2s;
}
.replay:hover{
  background:rgba(255,255,255,.1);
  color:rgba(255,255,255,.7);
}
</style>
</head>
<body>

<div class="phone">
  <div class="island"></div>

  <div class="splash">
    <!-- Rings ambient -->
    <div class="bg-ring"></div>
    <div class="bg-ring-2"></div>

    <!-- Logo -->
    <div class="logo-wrap">
      <svg width="190" height="190" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- O ring -->
        <circle class="o-ring"
          cx="512" cy="338" r="210"
          stroke="white" stroke-width="130" fill="none"/>
        <!-- Teal dot -->
        <circle class="teal-dot"
          cx="512" cy="586" r="32" fill="#00D4AA"/>
        <!-- T bar -->
        <rect class="t-bar"
          x="292" y="654" width="440" height="110" fill="white"/>
        <!-- T stem -->
        <rect class="t-stem"
          x="457" y="654" width="110" height="300" fill="white"/>
      </svg>
    </div>

    <!-- Wordmark -->
    <div class="wordmark">
      <div class="wordmark-name">Opti<span>Tank</span></div>
      <div class="wordmark-tag">Carburant intelligent · Suisse</div>
    </div>

    <!-- Loader -->
    <div class="loader-wrap">
      <div class="loader-track">
        <div class="loader-fill"></div>
      </div>
    </div>
  </div>

  <!-- Replay -->
  <button class="replay" onclick="location.reload()">↺ Rejouer</button>
</div>

</body>
</html>
