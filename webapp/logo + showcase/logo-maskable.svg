<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  
  
  <defs>
    <linearGradient id="m-drop" x1="0%" y1="0%" x2="20%" y2="100%">
      <stop offset="0%" stop-color="#A8A3FF"></stop>
      <stop offset="45%" stop-color="#6C63FF"></stop>
      <stop offset="100%" stop-color="#3A31C4"></stop>
    </linearGradient>
    <radialGradient id="m-bg" cx="50%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#16122E"></stop>
      <stop offset="100%" stop-color="#07070D"></stop>
    </radialGradient>
    <radialGradient id="m-glow" cx="50%" cy="55%" r="55%">
      <stop offset="0%" stop-color="rgba(108,99,255,0.38)"></stop>
      <stop offset="100%" stop-color="rgba(108,99,255,0)"></stop>
    </radialGradient>
    <radialGradient id="m-teal" cx="38%" cy="34%" r="66%">
      <stop offset="0%" stop-color="#4EECD4"></stop>
      <stop offset="100%" stop-color="#009E80"></stop>
    </radialGradient>
    <radialGradient id="m-hl" cx="30%" cy="28%" r="55%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.22)"></stop>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"></stop>
    </radialGradient>
    <filter id="m-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" result="blur"></feGaussianBlur>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.42 0 0 0 0 0.39 0 0 0 0 1 0 0 0 0.65 0" result="s"></feColorMatrix>
      <feMerge><feMergeNode in="s"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
    <filter id="m-tglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"></feGaussianBlur>
      <feMerge><feMergeNode in="blur"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
  </defs>

  
  <rect width="512" height="512" fill="url(#m-bg)"></rect>
  <ellipse cx="256" cy="290" rx="210" ry="175" fill="url(#m-glow)"></ellipse>

  
  <path d="M256,82 C228,82 152,168 152,284 C152,378 200,452 256,452 C312,452 360,378 360,284 C360,168 284,82 256,82 Z" fill="url(#m-drop)" filter="url(#m-shadow)"></path>
  <path d="M256,82 C228,82 152,168 152,284 C152,378 200,452 256,452 C312,452 360,378 360,284 C360,168 284,82 256,82 Z" fill="url(#m-hl)"></path>

  <g filter="url(#m-tglow)">
    <circle cx="256" cy="310" r="80" fill="none" stroke="#00D4AA" stroke-width="1.5" opacity="0.18"></circle>
    <circle cx="256" cy="310" r="54" fill="none" stroke="#00D4AA" stroke-width="1.8" opacity="0.30"></circle>
    <circle cx="256" cy="310" r="30" fill="none" stroke="#00D4AA" stroke-width="2.2" opacity="0.48"></circle>
  </g>

  <circle cx="256" cy="310" r="20" fill="rgba(0,212,170,0.18)"></circle>
  <circle cx="256" cy="310" r="12" fill="#00D4AA"></circle>
  <circle cx="251" cy="305" r="5" fill="white" opacity="0.55"></circle>

  <line x1="256" y1="82" x2="256" y2="56" stroke="#8B84FF" stroke-width="10" stroke-linecap="round"></line>
  <circle cx="256" cy="45" r="24" fill="rgba(0,212,170,0.22)"></circle>
  <circle cx="256" cy="45" r="17" fill="url(#m-teal)"></circle>
  <circle cx="249" cy="38" r="6.5" fill="white" opacity="0.50"></circle>
</svg>