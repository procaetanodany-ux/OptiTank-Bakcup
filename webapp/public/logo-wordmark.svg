<svg xmlns="http://www.w3.org/2000/svg" width="560" height="120" viewBox="0 0 560 120">
  <defs>
    <linearGradient id="w-drop" x1="0%" y1="0%" x2="20%" y2="100%">
      <stop offset="0%" stop-color="#A8A3FF"></stop>
      <stop offset="45%" stop-color="#6C63FF"></stop>
      <stop offset="100%" stop-color="#3A31C4"></stop>
    </linearGradient>
    <radialGradient id="w-bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#16122E"></stop>
      <stop offset="100%" stop-color="#07070D"></stop>
    </radialGradient>
    <radialGradient id="w-glow" cx="50%" cy="60%" r="55%">
      <stop offset="0%" stop-color="rgba(108,99,255,0.35)"></stop>
      <stop offset="100%" stop-color="rgba(108,99,255,0)"></stop>
    </radialGradient>
    <radialGradient id="w-teal" cx="38%" cy="34%" r="66%">
      <stop offset="0%" stop-color="#4EECD4"></stop>
      <stop offset="100%" stop-color="#009E80"></stop>
    </radialGradient>
    <radialGradient id="w-hl" cx="30%" cy="28%" r="55%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.22)"></stop>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"></stop>
    </radialGradient>
    <clipPath id="w-round">
      <rect x="0" y="0" width="120" height="120" rx="27" ry="27"></rect>
    </clipPath>
    <filter id="w-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"></feGaussianBlur>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.42 0 0 0 0 0.39 0 0 0 0 1 0 0 0 0.7 0" result="s"></feColorMatrix>
      <feMerge><feMergeNode in="s"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
    <filter id="w-tglow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"></feGaussianBlur>
      <feMerge><feMergeNode in="blur"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
  </defs>

  
  <g clip-path="url(#w-round)">
    <rect x="0" y="0" width="120" height="120" fill="url(#w-bg)"></rect>
    <ellipse cx="60" cy="68" rx="50" ry="42" fill="url(#w-glow)"></ellipse>
    
    <path d="M60,16 C53,16 33,38 33,66 C33,89 45,106 60,106 C75,106 87,89 87,66 C87,38 67,16 60,16Z" fill="url(#w-drop)" filter="url(#w-shadow)"></path>
    <path d="M60,16 C53,16 33,38 33,66 C33,89 45,106 60,106 C75,106 87,89 87,66 C87,38 67,16 60,16Z" fill="url(#w-hl)"></path>
    
    <g filter="url(#w-tglow)">
      <circle cx="60" cy="73" r="21" fill="none" stroke="#00D4AA" stroke-width="0.6" opacity="0.18"></circle>
      <circle cx="60" cy="73" r="14" fill="none" stroke="#00D4AA" stroke-width="0.7" opacity="0.30"></circle>
      <circle cx="60" cy="73" r="8" fill="none" stroke="#00D4AA" stroke-width="0.8" opacity="0.48"></circle>
    </g>
    <circle cx="60" cy="73" r="5" fill="rgba(0,212,170,0.18)"></circle>
    <circle cx="60" cy="73" r="3.3" fill="#00D4AA"></circle>
    
    <line x1="60" y1="16" x2="60" y2="10" stroke="#8B84FF" stroke-width="2.5" stroke-linecap="round"></line>
    <circle cx="60" cy="7" r="6" fill="rgba(0,212,170,0.2)"></circle>
    <circle cx="60" cy="7" r="4.5" fill="url(#w-teal)"></circle>
    <circle cx="58" cy="5.5" r="1.8" fill="white" opacity="0.5"></circle>
  </g>

  
  
  <text x="140" y="78" font-family="Inter, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-weight="800" font-size="58" letter-spacing="-1.5" fill="white">Opti</text>
  <text x="294" y="78" font-family="Inter, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-weight="800" font-size="58" letter-spacing="-1.5" fill="rgba(255,255,255,0.75)">Tank</text>
  
  <circle cx="547" cy="66" r="6" fill="#6C63FF"></circle>
</svg>