<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{
  width:100%;height:100%;background:#030307;
  display:flex;align-items:center;justify-content:center;
  font-family:'Inter',sans-serif;overflow:hidden;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse 55% 45% at 30% 20%,rgba(108,99,255,.13),transparent 60%),
    radial-gradient(ellipse 40% 35% at 75% 75%,rgba(0,212,170,.08),transparent 55%);
}
::-webkit-scrollbar{display:none}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeDown{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:translateY(0)}}
@keyframes springIn{from{opacity:0;transform:scale(.55) translateY(24px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes slideInR{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes slideInL{from{transform:translateX(-110%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes slideOutL{from{transform:translateX(0);opacity:1}to{transform:translateX(-60px);opacity:0}}
@keyframes float{0%,100%{transform:translateY(0) rotate(.5deg)}50%{transform:translateY(-10px) rotate(-.5deg)}}
@keyframes fuelDance{0%,100%{transform:rotate(-9deg) translateY(0)}50%{transform:rotate(9deg) translateY(-7px)}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 16px 4px rgba(108,99,255,.3)}50%{box-shadow:0 0 32px 10px rgba(108,99,255,.6)}}
@keyframes ringOut{0%{transform:scale(.9);opacity:.7}100%{transform:scale(2.2);opacity:0}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes confetti{0%{transform:translate(0,0) rotate(0) scale(1);opacity:1}100%{transform:translate(var(--cx),var(--cy)) rotate(var(--cr)) scale(0);opacity:0}}
@keyframes tabSlide{from{left:var(--from);width:var(--fw)}to{left:var(--to);width:var(--tw)}}
@keyframes motorReveal{from{opacity:0;transform:translateX(40px) scale(.9)}to{opacity:1;transform:translateX(0) scale(1)}}
@keyframes carReveal{from{opacity:0;transform:translateX(-40px) scale(.9)}to{opacity:1;transform:translateX(0) scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes checkDraw{from{stroke-dashoffset:30}to{stroke-dashoffset:0}}
@keyframes bounceIn{0%{transform:scale(0) rotate(-20deg);opacity:0}60%{transform:scale(1.15) rotate(5deg)}80%{transform:scale(.95) rotate(-2deg)}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes dotPulse{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.5);opacity:1}}
</style>
</head>

// ─── CAR SVG ──────────────────────────────────────────────────────────────────
const CarSVG = ({type='berline', color='#6C63FF', w=260}) => {
  const body = {
    berline:'M28 56 L44 34 Q58 20 84 20 Q132 20 156 20 Q176 20 192 35 L207 56 L218 60 Q220 68 217 73 L205 74 L200 74 Q198 82 187 82 Q176 82 174 74 L78 74 Q76 82 65 82 Q54 82 52 74 L18 74 Q14 67 18 61 Z',
    suv:    'M24 57 L40 29 Q55 14 82 14 Q140 14 166 14 Q186 14 202 30 L212 57 L220 61 Q222 70 218 75 L206 76 L200 76 Q198 84 187 84 Q176 84 174 76 L78 76 Q76 84 65 84 Q54 84 52 76 L16 76 Q12 68 16 62 Z',
    break:  'M26 56 L42 34 Q56 20 78 20 Q160 20 178 20 Q196 20 208 34 L215 56 L220 60 Q221 68 218 74 L206 74 L200 74 Q198 82 187 82 Q176 82 174 74 L78 74 Q76 82 65 82 Q54 82 52 74 L16 74 Q13 67 16 61 Z',
  }[type];
  const wins = {
    berline:[{d:'M55 44 Q66 26 90 26 L135 26 L148 44 Z',o:.28},{d:'M151 44 L162 26 Q180 26 193 38 L198 44 Z',o:.18}],
    suv:    [{d:'M52 42 Q65 20 90 20 L140 20 L155 42 Z',o:.28},{d:'M159 42 L169 20 Q185 20 198 33 L203 42 Z',o:.18}],
    break:  [{d:'M50 43 Q64 26 82 26 L182 26 L196 43 Z',o:.26}],
  }[type];
  return (
    <svg width={w} height={w*.43} viewBox="0 0 240 100" fill="none">
      <defs>
        <linearGradient id={`cg-${type}-${color.replace('#','')}`} x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stopColor={color} stopOpacity=".92"/>
          <stop offset="100%" stopColor={color} stopOpacity=".55"/>
        </linearGradient>
        <filter id={`cs-${type}`} x="-15%" y="-15%" width="130%" height="150%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="b"/>
          <feColorMatrix in="b" values={`0 0 0 0 .2  0 0 0 0 .15  0 0 0 0 .5  0 0 0 .5 0`} result="s"/>
          <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <path d={body} fill={`url(#cg-${type}-${color.replace('#','')})`} filter={`url(#cs-${type})`}/>
      {wins.map((w2,i) => <path key={i} d={w2.d} fill={`rgba(255,255,255,${w2.o})`}/>)}
      {/* Wheels */}
      {[[64,76],[178,76]].map(([cx,cy],i) => (

    </svg>
  );
};

// ─── MOTO SVG ─────────────────────────────────────────────────────────────────
const MotoSVG = ({color='#6C63FF', w=240}) => (
  <svg width={w} height={w*.55} viewBox="0 0 220 120" fill="none">
    <defs>
      <linearGradient id={`mg-${color.replace('#','')}`} x1="0%" y1="0%" x2="20%" y2="100%">

        <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="b"/>
        <feColorMatrix in="b" values="0 0 0 0 .15 0 0 0 0 .1 0 0 0 0 .5 0 0 0 .5 0" result="s"/>
        <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>

    <path d="M50 58 L62 45 L95 38 L130 36 L155 42 L170 60 L160 62 L140 50 L110 48 L85 52 L72 62 Z"

    {/* Exhaust */}
    <path d="M52 78 Q40 82 28 80 Q22 79 20 76" stroke={color} strokeWidth="5" fill="none" strokeLinecap="round" opacity=".6"/>
    {/* Engine block */}
    <rect x="78" y="56" width="50" height="26" rx="5" fill={color} opacity=".35"/>

    {/* Headlight */}
    <ellipse cx="190" cy="52" rx="10" ry="7" fill={color} opacity=".7"/>
    <ellipse cx="190" cy="52" rx="5" ry="3.5" fill="rgba(255,255,255,.5)"/>
    <ellipse cx="110" cy="72" rx="44" ry="4" fill="rgba(255,255,255,.04)"/>

// ─── FUELO MINI ───────────────────────────────────────────────────────────────
const FueloMini = ({size=48, mood='happy'}) => {
  const mc = mood==='excited'?W : mood==='love'?D : A;
  return (
    <svg width={size} height={size*1.3} viewBox="0 0 80 104" fill="none">
      <defs>
        <linearGradient id={`fm-${mood}`} x1="40" y1="4" x2="40" y2="96" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stopColor="#B0ABFF"/><stop offset="100%" stopColor="#3328B8"/>
        </linearGradient>
        <radialGradient id={`ft2-${mood}`} cx="38%" cy="34%" r="66%">
          <stop offset="0%" stopColor="#5FF0D8"/><stop offset="100%" stopColor="#009E80"/>
        </radialGradient>
      </defs>
      <path d="M40 7C24 7 8 31 8 53 8 75 22 97 40 97 58 97 72 75 72 53 72 31 56 7 40 7Z" fill={`url(#fm-${mood})`}/>
      <ellipse cx="28" cy="37" rx="8" ry="13" fill="rgba(255,255,255,.17)" transform="rotate(-20 28 37)"/>
      <circle cx="29" cy="54" r="7" fill="#0A0A0F"/><circle cx="51" cy="54" r="7" fill="#0A0A0F"/>
      <circle cx="31" cy="52" r="3" fill={mc}/><circle cx="53" cy="52" r="3" fill={mc}/>
      <circle cx="32.5" cy="50.5" r="1.3" fill="white" opacity=".9"/>
      <circle cx="54.5" cy="50.5" r="1.3" fill="white" opacity=".9"/>
      {mood==='excited'
        ? <path d="M28 64 Q40 78 52 64" stroke="#0A0A0F" strokeWidth="3.5" strokeLinecap="round" fill="none"/>
        : mood==='love'
        ? <path d="M28 65 Q40 79 52 65" stroke="#0A0A0F" strokeWidth="3.5" strokeLinecap="round" fill="none"/>
        : <path d="M31 67 Q40 76 49 67" stroke="#0A0A0F" strokeWidth="3.5" strokeLinecap="round" fill="none"/>
      }
      <line x1="40" y1="7" x2="40" y2="0" stroke="#8B84FF" strokeWidth="3.5" strokeLinecap="round"/>
      <circle cx="40" cy="-3" r="6" fill={`url(#ft2-${mood})`}/>
      <circle cx="37" cy="-6" r="2.2" fill="white" opacity=".5"/>
    </svg>
  );
};

// ─── PROGRESS ─────────────────────────────────────────────────────────────────
const Progress = ({step, total}) => (
  <div style={{position:'absolute',top:0,left:0,right:0,height:3,zIndex:100,background:'rgba(255,255,255,.07)'}}>
    <div style={{
      height:'100%',borderRadius:999,
      background:`linear-gradient(90deg,${PL},${A})`,
      width:`${(step/total)*100}%`,
      transition:'width .55s cubic-bezier(0.34,1.1,0.64,1)',
      boxShadow:`0 0 8px ${PL}`,
    }}/>
  </div>
);

// ─── BRAND CARD ───────────────────────────────────────────────────────────────
const BrandCard = ({brand, selected, onSelect, idx}) => {
  const [p,setP] = React.useState(false);
  return (
    <div
      onPointerDown={()=>setP(true)}
      onPointerUp={()=>{setP(false);onSelect(brand.id);}}
      onPointerLeave={()=>setP(false)}
      style={{
        background: selected ? `${brand.color}28` : SURF,
        border:`1.5px solid ${selected ? brand.color : BORD}`,
        borderRadius:16, padding:'13px 8px',
        display:'flex',flexDirection:'column',alignItems:'center',gap:6,
        cursor:'pointer', position:'relative',
        transform: p ? 'scale(.9)' : selected ? 'scale(1.05)' : 'scale(1)',
        transition:'all .18s cubic-bezier(0.34,1.56,0.64,1)',
        boxShadow: selected ? `0 4px 20px ${brand.color}50` : 'none',
        animation:`springIn .4s cubic-bezier(0.34,1.56,0.64,1) ${idx*0.035}s both`,
      }}>
      <div style={{
        width:40,height:40,borderRadius:11,

// ─── CONFETTI ─────────────────────────────────────────────────────────────────
const Confetti = () => {
  const cols = [P,PL,A,AL,S,W,'#F472B6','#60A5FA'];
  const items = React.useMemo(()=>Array.from({length:50},(_, i)=>({
    id:i, color:cols[i%cols.length],
    cx:`${(Math.random()-.5)*300}px`,
    cy:`${-Math.random()*500-80}px`,
    cr:`${Math.random()*720-360}deg`,
    left:`${Math.random()*100}%`,
    top:`${20+Math.random()*40}%`,
    size:5+Math.random()*8,
    isCirc:Math.random()>.5,
    delay:Math.random()*.4,
    dur:.9+Math.random()*.5,
  })),[]);
  return (
    <div style={{position:'absolute',inset:0,pointerEvents:'none',zIndex:50,overflow:'hidden'}}>
      {items.map(it=>(
        <div key={it.id} style={{
          position:'absolute',left:it.left,top:it.top,
          width:it.isCirc?it.size:it.size*1.5,
          height:it.isCirc?it.size:it.size*.6,
          borderRadius:it.isCirc?'50%':3,
          background:it.color,
          '--cx':it.cx,'--cy':it.cy,'--cr':it.cr,
          animation:`confetti ${it.dur}s ease ${it.delay}s forwards`,
          opacity:0,
        }}/>
      ))}
    </div>
  );
};

                fontSize:14,fontWeight:900,color:'white',
                boxShadow:`0 4px 14px ${brandColor}55`,flexShrink:0,
              }}>{brandData?.abbr}</div>
              <div>
                <div style={{fontSize:11,fontWeight:700,color:`${brandColor}`,letterSpacing:'.05em',textTransform:'uppercase'}}>
                  {brandData?.name}
                </div>
                <div style={{fontSize:20,fontWeight:900,color:'white',letterSpacing:'-.4px'}}>
                  {modelData?.name || 'Modèle personnalisé'}
                </div>
              </div>
              {showDone && (
                <div style={{
                  marginLeft:'auto',width:36,height:36,borderRadius:'50%',
                  background:`linear-gradient(135deg,${AL},${A})`,
                  display:'flex',alignItems:'center',justifyContent:'center',
                  boxShadow:`0 4px 14px ${A}50`,
                  animation:'bounceIn .5s cubic-bezier(0.34,1.56,0.64,1)',
                }}>
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3">
                    <path d="M20 6L9 17l-5-5"/>
                  </svg>
                </div>
              )}
            </div>

            {/* Specs grid */}
            {modelData && (
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,animation:'fadeUp .4s ease .3s both'}}>
                {[
                  {label:'Carburant', val:modelData.fuel, color:fc},
                  {label:'Réservoir',  val:modelData.tank, color:PL},
                  {label:'Année',      val:modelData.year, color:'rgba(255,255,255,.6)'},
                  {label:'Puissance',  val:`${modelData.hp} ch`, color:W},
                ].map(sp=>(
                  <div key={sp.label} style={{
                    background:'rgba(255,255,255,.05)',borderRadius:12,padding:'10px 12px',
                    border:'1px solid rgba(255,255,255,.07)',
                  }}>
                    <div style={{fontSize:10,fontWeight:600,color:'rgba(255,255,255,.35)',letterSpacing:'.05em',textTransform:'uppercase',marginBottom:3}}>
                      {sp.label}
                    </div>
                    <div style={{fontSize:16,fontWeight:800,color:sp.color}}>{sp.val}</div>
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* Fuelo + message */}
          <div style={{
            display:'flex',alignItems:'center',gap:14,
            background:'rgba(108,99,255,.1)',border:`1px solid ${BORD}`,
            borderRadius:20,padding:'14px 16px',width:'100%',marginBottom:24,
            animation:'fadeUp .4s ease .4s both',
          }}>
            <div style={{animation:'fuelDance 2s ease-in-out infinite',flexShrink:0}}>
              <FueloMini size={44} mood="excited"/>
            </div>
            <div>
              <div style={{fontSize:14,fontWeight:700,color:'white',marginBottom:2}}>Fuelo est prêt ! 🎉</div>
              <div style={{fontSize:12,color:'rgba(255,255,255,.5)',lineHeight:1.5}}>
                Je vais trouver les meilleurs prix pour ton {vehicleType==='car'?'véhicule':'deux-roues'} en Suisse.
              </div>
            </div>
          </div>

          {/* Estimated savings */}
          <div style={{
            background:`linear-gradient(135deg,rgba(0,212,170,.18),rgba(34,197,94,.08))`,
            border:'1px solid rgba(0,212,170,.3)',borderRadius:18,
            padding:'14px 18px',width:'100%',textAlign:'center',marginBottom:24,
            animation:'fadeUp .4s ease .5s both',
          }}>
            <div style={{fontSize:11,fontWeight:700,color:A,letterSpacing:'.06em',textTransform:'uppercase',marginBottom:4}}>
              Économies estimées / mois
            </div>
            <div style={{fontSize:36,fontWeight:900,color:A,letterSpacing:'-1.5px',lineHeight:1}}>
              CHF 47.30
            </div>
            <div style={{fontSize:12,color:'rgba(255,255,255,.4)',marginTop:4}}>
              Basé sur les prix actuels en {modelData?.fuel || 'SP95'} · Vaud
            </div>
          </div>

          <div style={{width:'100%',animation:'fadeUp .4s ease .6s both'}}>
            <Btn variant="accent" onClick={()=>{
              setConfirmed(true);
              setConfetti(true);
              setTimeout(()=>setConfetti(false),2500);
            }}>
              {confirmed ? '✓ Véhicule enregistré !' : `Confirmer mon ${vehicleType==='car'?'véhicule':'moto'} →`}
            </Btn>
            <button onClick={()=>{setStep(0);setSelectedBrand(null);setSelectedModel(null);setConfirmed(false);}} style={{
              width:'100%',background:'none',border:'none',cursor:'pointer',
              color:'rgba(255,255,255,.3)',fontSize:13,fontFamily:'Inter,sans-serif',
              marginTop:8,padding:8,fontWeight:500,
            }}>Modifier mon véhicule</button>
          </div>
        </div>
      </StepWrap>
    );
  };

  const Steps = [Step0, Step1, Step2, Step3];
  const Current = Steps[step];

  return (
    <div style={{position:'absolute',inset:0,background:BG,overflow:'hidden'}}>
      <Progress step={step} total={TOTAL-1}/>
      <Current/>
    </div>
  );
}

// ─── Boot ─────────────────────────────────────────────────────────────────────
(function clock(){
  const el=document.getElementById('stTime');
  if(el){const n=new Date();el.textContent=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');}
  setTimeout(clock,30000);
})();
(function scale(){
  const p=document.getElementById('phone');
  if(!p)return;
  const s=Math.min(1,(window.innerHeight-40)/852,(window.innerWidth-40)/393);
  p.style.transform=`scale(${s})`;
  p.style.marginBottom=`${-(852*(1-s))}px`;
  p.style.marginRight=`${-(393*(1-s))}px`;
})();
window.addEventListener('resize',()=>{
  const p=document.getElementById('phone');if(!p)return;
  const s=Math.min(1,(window.innerHeight-40)/852,(window.innerWidth-40)/393);
  p.style.transform=`scale(${s})`;
  p.style.marginBottom=`${-(852*(1-s))}px`;
  p.style.marginRight=`${-(393*(1-s))}px`;
});

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
